# NemoGuardrails CR — deploys the NeMo Guardrails proxy pod.
#
# Prerequisites:
#   - TrustyAI operator enabled (trustyai.managementState: Managed in DSC)
#   - ConfigMap applied: oc apply -f nemoguardrails-configmap.yaml
#   - Secret created:
#       oc create secret generic langgraph-react-agent-guardrails-secrets \
#         --from-literal=api-key=<your-llm-api-key>
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: langgraph-react-agent-guardrails
  labels:
    app.kubernetes.io/name: langgraph-react-agent-guardrails
    app.kubernetes.io/component: nemoguardrails
  annotations:
    security.opendatahub.io/enable-auth: "false"
spec:
  replicas: 1
  nemoConfigs:
    - name: local
      configMaps:
        - langgraph-react-agent-guardrails-config
      default: true
  env:
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: langgraph-react-agent-guardrails-secrets
          key: api-key
