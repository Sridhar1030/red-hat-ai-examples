[project]
name = "react_agent"
version = "0.1.0"
description = "A LangGraph ReAct agent for automated red-teaming with garak, deployable on RHOAI."
authors = [{ name = "Red Hat AI Examples", email = "noreply@redhat.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.10",
    "langgraph-prebuilt>=1.0.8",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "setuptools>=80.9.0,<83.0.0",
    "chardet>=7.1.0",
    "starlette>=1.0.1",
    "protobuf<7",
]

[project.optional-dependencies]
auth = [
    "agent-auth",
]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.27",
]
eval = [
    "unitxt>=1.24.0",
    "datasets==3.6.0",
    "nltk>=3.9.1",
    "rouge-score>=0.1.2",
]
tracing = [
    "mlflow[kubernetes]>=3.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"
